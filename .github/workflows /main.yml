name: Update subscription

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate sub.txt
        run: node generate.js

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sub.txt
          # ✅ كيتحقق واش كاين شي تغيير، إلا كان كيدير commit
          git diff --cached --quiet || git commit -m "Update subscription"
          # ✅ كيدير pull --rebase باش يتفادى أي conflict
          git pull origin main --rebase || true
          git push || true
